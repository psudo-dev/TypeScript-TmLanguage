name: Sync to Origin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-to-origin
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and check for changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current commit
        id: before
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"

      - name: Sync fork with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/microsoft/TypeScript-TmLanguage.git

          # Retry logic for git fetch (5s, 15s, 45s, 90s, 300s)
          DELAYS=(5 15 45 90 300)
          FETCH_SUCCESS=false

          for i in "${!DELAYS[@]}"; do
            echo "Attempting git fetch (Attempt $((i+1)))..."
            if git fetch upstream master; then
              FETCH_SUCCESS=true
              break
            fi
            echo "git fetch failed. Waiting ${DELAYS[$i]}s..."
            sleep ${DELAYS[$i]}
          done

          if [ "$FETCH_SUCCESS" = "false" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merge operations do not retry (conflicts are deterministic)
          if ! git merge upstream/master --no-edit 2> sync-error.txt; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "Merge failed:"
            cat sync-error.txt
            git merge --abort || true
            exit 0
          fi

          # Retry logic for git push (5s, 15s, 45s, 90s, 300s)
          PUSH_SUCCESS=false
          for i in "${!DELAYS[@]}"; do
            echo "Attempting git push (Attempt $((i+1)))..."
            if git push origin master 2>> push-error.txt; then
              PUSH_SUCCESS=true
              break
            fi
            echo "git push failed. Waiting ${DELAYS[$i]}s..."
            sleep ${DELAYS[$i]}
          done

          if [ "$PUSH_SUCCESS" = "false" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "Push failed:"
            cat push-error.txt
            exit 0
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Get new commit
        id: after
        if: steps.sync.outputs.failed == 'false'
        run: |
          SHA=$(git rev-parse HEAD)

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "New SHA: $SHA"

      - name: Check for tmLanguage changes
        id: changes
        if: steps.sync.outputs.failed == 'false' && steps.before.outputs.sha != steps.after.outputs.sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_SHA: ${{ steps.before.outputs.sha }}
          NEW_SHA: ${{ steps.after.outputs.sha }}
        run: |
          DELAYS=(5 15 45 90 300)
          API_SUCCESS=false

          for i in "${!DELAYS[@]}"; do
            if gh api repos/psudo-dev/TypeScript-TmLanguage/compare/$OLD_SHA...$NEW_SHA --jq '.files[].filename' > changed-files.txt; then
              API_SUCCESS=true
              break
            fi
            echo "gh api failed. Retrying in ${DELAYS[$i]}s..."
            sleep ${DELAYS[$i]}
          done

          if [ "$API_SUCCESS" = "false" ]; then
            echo "Failed to fetch compare data from GitHub API after all retries."
            exit 1
          fi

          TM_LANGUAGE_FILES=$(grep -E '\.tmLanguage$' changed-files.txt || true)

          if [ -z "$TM_LANGUAGE_FILES" ]; then
            echo "No .tmLanguage files changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          EOF_DELIMITER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "files<<${EOF_DELIMITER}"
            echo "$TM_LANGUAGE_FILES"
            echo "${EOF_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci --prefix .github/scripts

      - name: Create notification issue
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_SHA: ${{ steps.before.outputs.sha }}
          NEW_SHA: ${{ steps.after.outputs.sha }}
          FILES: ${{ steps.changes.outputs.files }}
        run: npx tsx .github/scripts/src/create-notification-issue.ts
